[package]
name = "greenhold-host"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[[bin]]
name = "greenhold"
path = "src/main.rs"

[features]
reproducible = ["greenhold-guest-builder/reproducible"]

[dependencies]
anyhow.workspace = true
base64 = "0.22"
bincode = "1.3"
bip324 = "0.11"
bitcoin.workspace = true
clap = { version = "4", features = ["derive"] }
indicatif = "0.18"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde.workspace = true
serde_json = { version = "1", features = ["raw_value"] }
ureq = { version = "3", default-features = false, features = ["rustls"] }
url = "2"
webpki-roots = "1"
greenhold-core.workspace = true
greenhold-guest-builder.workspace = true
risc0-zkvm = { workspace = true, features = ["prove", "disable-dev-mode"] }

[dev-dependencies]
greenhold-signer.workspace = true
tempfile = "3"
testcontainers = { version = "=0.28.0", features = ["blocking"] }
wait-timeout = "0.2"
