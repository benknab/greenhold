[package]
name = "walledcity-host"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
anyhow = "1"
base64 = "0.22"
bip324 = "0.11"
bitcoin = { version = "0.32", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["arbitrary_precision", "raw_value"] }
ureq = { version = "3", default-features = false, features = ["rustls"] }
url = "2"
webpki-roots = "1"
walledcity-core.workspace = true
walledcity-guest-builder.workspace = true
risc0-zkvm = { workspace = true, features = ["client", "disable-dev-mode"] }
