[resolver]
incompatible-rust-versions = "fallback"

[alias]
lint = "clippy --locked --workspace --all-targets -- -D warnings"
# target/reproducible/greenhold-host, with the guest built in Docker and checked against
# guest-builder/image-id.
reproducible = "build --locked --profile reproducible -p greenhold-host --features reproducible"
regtest = "test --locked -p greenhold-host --test regtest -- --ignored --nocapture --test-threads=1"
# Fast debug-build test loop. Built-in `cargo t` cannot be overridden.
quick = "test --locked --workspace --exclude greenhold-guest"
mutate = "mutants --package greenhold-core --package greenhold-host"
# Core-only mutations: test core alone, without rebuilding the host.
mutate-core = "mutants --package greenhold-core --test-package greenhold-core"

[env]
# Apply --locked to the nested guest build as well as the outer host build.
RISC0_BUILD_LOCKED = "1"
