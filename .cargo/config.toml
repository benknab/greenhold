[resolver]
incompatible-rust-versions = "fallback"

[alias]
lint = "clippy --locked --release --workspace --all-targets -- -D warnings"
regtest = "test --locked --release -p walledcity-host --test regtest -- --ignored --nocapture"
mutate = "mutants --package walledcity-core --package walledcity-host"

[env]
# Apply --locked to the nested guest build as well as the outer host build.
RISC0_BUILD_LOCKED = "1"
